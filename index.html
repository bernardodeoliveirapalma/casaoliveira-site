}

html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}

/* lista */

/* ================= VÍDEOS: carregam quando aparecem e não param mais =================
   Por que um vídeo parava:
   1. Ao sair do app ou da aba, todos pausavam e nada mandava voltar.
   2. iPhone com "Reduzir movimento" nunca tocava os vídeos.
   3. Modo de pouca energia e navegadores de apps (Instagram) bloqueiam o play até o primeiro toque.
   4. Rede lenta podia travar o vídeo no meio, sem nova tentativa.
   Agora um vigia confere os vídeos visíveis a cada segundo e retoma o que estiver parado. */

    v.addEventListener('error', function () { if ((v.__err = (v.__err || 0) + 1) <= 3) setTimeout(function () { v.load(); vidPlay(v); }, 1500 * v.__err); });

// vigia: retoma vídeo pausado e destrava vídeo congelado
setInterval(function () {
  if (document.hidden) return;
  VIDS.forEach(function (v) {
    if (!v.__want || !v.isConnected) return;

  // textura de papel sobre o verde

  var shades = [];
  for (var q = 0; q < (W < 700 ? 9 : 14); q++) shades.push({
    spr: SHADOWS[q % 3], sz: (W < 700 ? 170 : 230) * (.75 + rnd() * .6), x: lerp(-.3, 1.1, rnd()) * W, y: lerp(-.1, 1.05, rnd()) * H,
    vx: 7 + rnd() * 10, vy: 2 + rnd() * 5, rot: rnd() * 6.283, vr: (rnd() - .5) * .12, a: .16 + rnd() * .16, ph: rnd() * 6.283
  });
  // assinatura discreta, letra por letra
  var NOME = new Image(); NOME.src = 'assets/intro-nome.png';
  var LETRAS = [[0, 95], [101, 196], [202, 289], [294, 389], [436, 537], [542, 620], [625, 641], [647, 742], [748, 823], [829, 845], [850, 937], [942, 1037]], NW = 1037, NH = 114;

  /* ---------- as folhas no ar ---------- */
  var mobile = W < 700, items = [], N = mobile ? 18 : 26;
  for (var j = 0; j < N; j++) {
    var isSprig = j >= N, z = isSprig ? 1 : .55 + rnd() * .75;
    items.push({
      spr: isSprig ? SPRIGS[j - N] : LEAVES[Math.floor(rnd() * LEAVES.length)],
      sz: isSprig ? (mobile ? 250 : 340) : (mobile ? 80 : 98) * z,
      z: z, alpha: isSprig ? .95 : .5 + .45 * Math.min(1, z),
      x: isSprig ? (j === N ? -170 : -W * .12 - 230) : lerp(-.35, 1.05, rnd()) * W,
      y: isSprig ? (j === N ? H * .24 : H * .7) : lerp(-.1, 1.05, rnd()) * H,
      vx: isSprig ? 62 + rnd() * 10 : (24 + rnd() * 20) * z, vy: (8 + rnd() * 12) * (isSprig ? .4 : z),
      rot: isSprig ? (j === N ? .35 : -.25) : rnd() * 6.283, vr: isSprig ? .05 : (rnd() - .5) * .9,
      flip: rnd() * 6.283, vf: isSprig ? .35 : (.5 + rnd() * .9) * (rnd() < .5 ? -1 : 1),

  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function wind(t) { return .75 + 1.1 * Math.exp(-Math.pow((t - 2.3) / .9, 2)); }   // uma brisa que cresce e acalma

  /* ---------- tempo ---------- */

  }
  function drawWord(t) {

    var dw = Math.min(W * .74, 560), k = dw / NW, dh = NH * k, x0 = (W - dw) / 2, y0 = H * .5 - dh / 2;
    ctx.save();

    }

  function frame(now) {

    if (t - gt > .083) { gt = t; gi = (gi + 1) % 3; }

    ctx.globalCompositeOperation = 'source-over';

  }
  function finish(ms) {
    if (done) return; done = true; cancelAnimationFrame(raf);
    root.classList.remove('intro');
    if (!lifted && page) { lifted = true; page.style.transform = ''; page.style.opacity = ''; }
    if (master && ac) { try { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(0, ac.currentTime + 1.4); } catch (e) {} }

    ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, easing: 'ease-out', fill: 'forwards' }).onfinish = kill;
  }

  addEventListener('resize', function () { if (!done) size(); });

})();

render();
})();
